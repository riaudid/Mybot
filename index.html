<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1xElite Ultimate Platform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f3ba2f; --dark: #0b0e11; --card: #1e2329; --green: #02c076; --red: #ff4d4d; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; padding-bottom: 30px; user-select: none; }
        
        /* Header & Balance */
        .header { background: var(--card); padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; sticky; top: 0; z-index: 100; }
        .balance-box { background: linear-gradient(180deg, #2b2f36, #1e2329); margin: 15px; padding: 20px; border-radius: 15px; border: 1px solid #3e444e; text-align: center; }
        .balance-val { font-size: 32px; color: var(--gold); font-weight: bold; }

        /* Grid - 11 Games */
        .section-title { padding: 0 15px; color: var(--gold); font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .game-item { background: var(--card); border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #2d333a; position: relative; }
        .game-item i { font-size: 32px; color: var(--gold); margin-bottom: 10px; display: block; }
        .badge { position: absolute; top: 8px; right: 8px; background: var(--red); font-size: 9px; padding: 2px 5px; border-radius: 5px; }

        /* Pop-up Overlay for Games */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; display: none; flex-direction: column; align-items: center; padding-top: 40px; }
        .close-area { position: absolute; top: 20px; left: 20px; font-size: 20px; }
        .game-screen { width: 90%; max-width: 400px; background: var(--card); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid #3e444e; }
        
        /* Specialized Game Styles */
        .mines-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; }
        .tile { background: #2b2f36; height: 60px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .btn-play { background: var(--gold); color: black; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 20px; font-size: 16px; }
        .crash-num { font-size: 60px; color: var(--gold); margin: 30px 0; font-weight: bold; }
    </style>
</head>
<body>
<div class="header">
    <span style="color:var(--gold); font-weight:bold">1xELITE ⚡</span>
    <span id="top-user">Guest</span>
</div>

<div class="balance-box">
    <div style="color:#848e9c; font-size:12px">الرصيد المتوفر</div>
    <div class="balance-val" id="user-balance">$0.00</div>
</div>

<div class="section-title">اختر لعبة للبدء:</div>

<div class="grid">
    <div class="game-item" onclick="openGame('mines')"><div class="badge">Hot</div><i class="fas fa-bomb"></i> الألغام</div>
    <div class="game-item" onclick="openGame('crash')"><div class="badge">New</div><i class="fas fa-rocket"></i> كراش</div>
    <div class="game-item" onclick="openGame('bj')"><i class="fas fa-spade"></i> بلاك جاك</div>
    <div class="game-item" onclick="alert('قريباً')"><i class="fas fa-dice"></i> النرد الكلاسيكي</div>
    <div class="game-item" onclick="alert('قريباً')"><i class="fas fa-dharmachakra"></i> الروليت الملكي</div>
    <div class="game-item" onclick="alert('قريباً')"><i class="fas fa-coins"></i> ماكينة الحظ</div>
    <div class="game-item" onclick="alert('قريباً')"><i class="fas fa-clone"></i> بلوت / ورق</div>
    <div class="game-item" onclick="alert('قريباً')"><i class="fas fa-stream"></i> بلينكو</div>
    <div class="game-item" onclick="alert('قريباً')"><i class="fas fa-adjust"></i> عملة الحظ</div>
    <div class="game-item" onclick="alert('قريباً')"><i class="fas fa-apple-alt"></i> تفاحة الحظ</div>
    <div class="game-item" onclick="alert('قريباً')"><i class="fas fa-arrow-trend-up"></i> ليمبو</div>
</div>

<div id="screen-mines" class="overlay">
    <div class="close-area" onclick="closeAll()"><i class="fas fa-chevron-left"></i> رجوع</div>
    <div class="game-screen">
        <h3>لعبة الألغام 💣</h3>
        <div id="m-status" style="font-size:12px; color:var(--gold)">ابحث عن الجواهر وتجنب القنابل</div>
        <div id="m-grid" class="mines-board"></div>
        <button id="m-start-btn" class="btn-play" onclick="setupMines()">بدء الرهان ($10)</button>
    </div>
</div>

<div id="screen-crash" class="overlay">
    <div class="close-area" onclick="closeAll()"><i class="fas fa-chevron-left"></i> رجوع</div>
    <div class="game-screen">
        <h3>كراش (الصاروخ) 🚀</h3>
        <div id="c-multiplier" class="crash-num">1.00x</div>
        <button id="c-cashout" class="btn-play" style="display:none; background:var(--green)" onclick="crashCashout()">سحب الأرباح</button>
        <button id="c-start" class="btn-play" onclick="startCrash()">انطلاق ($10)</button>
    </div>
</div>
<div id="screen-bj" class="overlay">
    <div class="close-area" onclick="closeAll()"><i class="fas fa-chevron-left"></i> رجوع</div>
    <div class="game-screen" style="background:#076324">
        <h3>بلاك جاك 21 🃏</h3>
        <div id="bj-info" style="margin:20px 0">الموزع: ? | أنت: 0</div>
        <div id="bj-ctrl" style="display:none; gap:10px">
            <button class="btn-play" onclick="bjHit()">Hit</button>
            <button class="btn-play" style="background:#4e5561; color:white" onclick="bjStand()">Stand</button>
        </div>
        <button id="bj-start" class="btn-play" onclick="startBJ()">رهان $10</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const urlParams = new URLSearchParams(window.location.search);
    let balance = parseFloat(urlParams.get('balance')) || 500.00;

    function syncB() { 
        document.getElementById('user-balance').innerText = "$" + balance.toFixed(2); 
    }
    syncB();

    function openGame(id) { document.getElementById('screen-'+id).style.display = 'flex'; }
    function closeAll() { document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none'); }

    // --- LOGIC: MINES ---
    let bombPos = -1;
    function setupMines() {
        if(balance < 10) return; balance -= 10; syncB();
        bombPos = Math.floor(Math.random()*16);
        const grid = document.getElementById('m-grid'); grid.innerHTML = '';
        for(let i=0; i<16; i++) {
            grid.innerHTML += `<div class="tile" onclick="playMine(this, ${i})">?</div>`;
        }
        document.getElementById('m-start-btn').style.display = 'none';
    }
    function playMine(el, i) {
        if(i === bombPos) {
            el.innerHTML = '💣'; el.style.background = 'red';
            alert('خسرت!'); document.getElementById('m-start-btn').style.display = 'block';
        } else {
            el.innerHTML = '💎'; el.style.background = 'green';
            balance += 5; syncB();
        }
    }

    // --- LOGIC: CRASH ---
        let cInt; let cMult = 1.0;
    function startCrash() {
        if(balance < 10) return; balance -= 10; syncB();
        cMult = 1.0;
        document.getElementById('c-start').style.display = 'none';
        document.getElementById('c-cashout').style.display = 'block';
        cInt = setInterval(() => {
            cMult += 0.04;
            document.getElementById('c-multiplier').innerText = cMult.toFixed(2) + "x";
            if(Math.random() < 0.03) {
                clearInterval(cInt); alert("انفجر الصاروخ!");
                resetCrash();
            }
        }, 150);
    }
    function crashCashout() {
        clearInterval(cInt); balance += (10 * cMult); syncB();
        alert("ربحت $" + (10*cMult).toFixed(2)); resetCrash();
    }
    function resetCrash() {
        document.getElementById('c-start').style.display = 'block';
        document.getElementById('c-cashout').style.display = 'none';
    }

    // --- LOGIC: BLACKJACK ---
    let pScore = 0;
    function startBJ() {
        if(balance < 10) return; balance -= 10; syncB();
        pScore = Math.floor(Math.random()*12)+10;
        document.getElementById('bj-info').innerText = "الموزع: ? | أنت: " + pScore;
        document.getElementById('bj-start').style.display = 'none';
        document.getElementById('bj-ctrl').style.display = 'flex';
    }
    function bjHit() {
        pScore += Math.floor(Math.random()*10)+1;
        document.getElementById('bj-info').innerText = "الموزع: ? | أنت: " + pScore;
        if(pScore > 21) bjEnd("تجاوزت الـ 21! خسرت.");
    }
    function bjStand() {
        let dScore = Math.floor(Math.random()*6)+17;
        if(dScore > 21 || pScore > dScore) { balance += 20; bjEnd("فزت بـ $20!"); }
        else { bjEnd("الموزع فاز!"); }
    }
    function bjEnd(m) { 
        alert(m); syncB();
        document.getElementById('bj-start').style.display = 'block';
        document.getElementById('bj-ctrl').style.display = 'none';
    }
</script>
</body>
</html>
