<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1xElite Full Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f3ba2f; --dark: #0b0e11; --card: #1e2329; --green: #02c076; --red: #ff4d4d; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        .header { background: var(--card); padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .balance-card { background: linear-gradient(180deg, #2b2f36, #1e2329); margin: 15px; padding: 20px; border-radius: 15px; border: 1px solid #3e444e; text-align: center; }
        .balance-val { font-size: 30px; color: var(--gold); font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .game-item { background: var(--card); border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #2d333a; cursor: pointer; }
        .game-item i { font-size: 35px; color: var(--gold); margin-bottom: 10px; display: block; }

        /* Overlay System */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; display: none; flex-direction: column; align-items: center; padding-top: 60px; }
        .close-btn { position: absolute; top: 20px; left: 20px; font-size: 24px; color: white; }
        .game-container { width: 90%; background: var(--card); border-radius: 20px; padding: 20px; text-align: center; }
        
        /* Mines Style */
        .mines-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 20px; }
        .mine-tile { background: #2b2f36; height: 60px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .btn-main { background: var(--gold); color: black; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header">
    <span style="color:var(--gold)">1xELITE ⚡</span>
    <span id="user">Guest</span>
</div>

<div class="balance-card">
    <div style="font-size:12px; color:#848e9c">الرصيد المتوفر</div>
    <div class="balance-val" id="main-balance">$0.00</div>
</div>

<div class="grid">
    <div class="game-item" onclick="showGame('mines')"><i class="fas fa-bomb"></i><span>الألغام</span></div>
    <div class="game-item" onclick="showGame('blackjack')"><i class="fas fa-spade"></i><span>بلاك جاك</span></div>
    <div class="game-item" onclick="showGame('dice')"><i class="fas fa-dice"></i><span>النرد</span></div>
    <div class="game-item" onclick="showGame('crash')"><i class="fas fa-rocket"></i><span>كراش</span></div>
</div>

<div id="game-mines" class="overlay">
    <i class="fas fa-times close-btn" onclick="hideAll()"></i>
    <div class="game-container">
        <h3>لعبة الألغام 💣</h3>
        <div id="mines-status">اختر المربعات وتجنب القنابل</div>
        <div class="mines-grid" id="m-grid"></div>
        <button class="btn-main" id="m-start" onclick="initMines()">بدء الرهان ($10)</button>
    </div>
</div>

<div id="game-blackjack" class="overlay">
    <i class="fas fa-times close-btn" onclick="hideAll()"></i>
    <div class="game-container" style="background:#076324; border: 5px solid #3d2b1f;">
        <h3>بلاك جاك 🃏</h3>
        <div id="bj-dealer" style="margin-bottom:20px">الموزع: ?</div>
        <div id="bj-msg" style="color:var(--gold); font-weight:bold"></div>
        <div id="bj-player" style="margin-top:20px">أنت: 0</div>
        <div id="bj-btns" style="display:none; gap:10px; margin-top:20px">
            <button class="btn-main" onclick="bjHit()" style="flex:1">طلب ورقة</button>
            <button class="btn-main" onclick="bjStand()" style="flex:1; background:#4e5561; color:white">توقف</button>
        </div>
        <button class="btn-main" id="bj-start" onclick="initBJ()">بدء الرهان ($10)</button>
    </div>
</div>

    const tg = window.Telegram.WebApp;
    tg.expand();
    const urlParams = new URLSearchParams(window.location.search);
    let balance = parseFloat(urlParams.get('balance')) || 500.00;
    
    function updateB() { 
        document.getElementById('main-balance').innerText = "$" + balance.toFixed(2); 
    }
    updateB();

    function showGame(id) { document.getElementById('game-'+id).style.display = 'flex'; }
    function hideAll() { 
        document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none'); 
    }

    let mines = [];
    function initMines() {
        if(balance < 10) return;
        balance -= 10; updateB();

        for(let i=0; i<3; i++) { // 3 قنابل
            let r = Math.floor(Math.random()*16);
            mines[r] = true;
        }
        const grid = document.getElementById('m-grid');
        grid.innerHTML = '';
        for(let i=0; i<16; i++) {
            grid.innerHTML += `<div class="mine-tile" onclick="checkMine(this, ${i})">?</div>`;
        }
        document.getElementById('m-start').style.display = 'none';
    }
    function checkMine(el, i) {
        if(mines[i]) {
            el.innerHTML = '💣'; el.style.background = 'red';
            alert('انفجرت القنبلة! خسرت');
            document.getElementById('m-start').style.display = 'block';
        } else {
            el.innerHTML = '💎'; el.style.background = 'green';
            balance += 5; updateB();
        }
    }
