<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1xElite Ultimate Platform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f3ba2f; --dark: #0b0e11; --card: #1e2329; --green: #02c076; --red: #ff4d4d; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; padding-bottom: 30px; user-select: none; }
        
        /* Header & Balance */
        .header { background: var(--card); padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; sticky; top: 0; z-index: 100; }
        .balance-box { background: linear-gradient(180deg, #2b2f36, #1e2329); margin: 15px; padding: 20px; border-radius: 15px; border: 1px solid #3e444e; text-align: center; }
        .balance-val { font-size: 32px; color: var(--gold); font-weight: bold; }

        /* Grid - 11 Games */
        .section-title { padding: 0 15px; color: var(--gold); font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .game-item { background: var(--card); border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #2d333a; position: relative; }
        .game-item i { font-size: 32px; color: var(--gold); margin-bottom: 10px; display: block; }
        .badge { position: absolute; top: 8px; right: 8px; background: var(--red); font-size: 9px; padding: 2px 5px; border-radius: 5px; }

        /* Pop-up Overlay for Games */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; display: none; flex-direction: column; align-items: center; padding-top: 40px; }
        .close-area { position: absolute; top: 20px; left: 20px; font-size: 20px; }
        .game-screen { width: 90%; max-width: 400px; background: var(--card); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid #3e444e; }
        
        /* Specialized Game Styles */
        .mines-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; }
        .tile { background: #2b2f36; height: 60px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .btn-play { background: var(--gold); color: black; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 20px; font-size: 16px; }
        .crash-num { font-size: 60px; color: var(--gold); margin: 30px 0; font-weight: bold; }
    </style>
</head>
<body>
